<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KeepFall</title>
    <style>
      :root {
        /* Room kept free for the touch controls: a bar under the game, or a strip on each side.
           Both stay 0 until the controls are shown. src/ui/touch.ts sets them. */
        --touch-h: 0px;
        --side-w: 0px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        /* The deepest color in the game's color set (src/render/colors.ts). */
        background: #140c0a;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      /* The screen minus the phone's safe areas (notches and rounded corners). */
      #stage {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        box-sizing: border-box;
        padding: 0 var(--side-w) var(--touch-h);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The canvas holds the 400 by 300 pixel grid. It is scaled up with nearest neighbor so every
         art pixel stays a crisp square. src/main.ts picks the size. Older browsers need the first lines. */
      #game {
        display: block;
        flex: none;
        background: #22150f;
        outline: none;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        -ms-interpolation-mode: nearest-neighbor;
      }
      #touch-controls {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #touch-controls.on {
        display: block;
      }
      .tc-pad,
      .tc-block {
        position: absolute;
        pointer-events: auto;
      }
      .tc-pad svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .tc-cross {
        fill: #2a1d17;
        stroke: #8a6a3c;
        stroke-width: 3;
        stroke-linejoin: round;
      }
      .tc-lit {
        fill: #3a2a21;
      }
      .tc-tri {
        fill: #bfa57a;
      }
      .tc-hub {
        fill: #1b1310;
        stroke: #8a6a3c;
        stroke-width: 2;
      }
      .tc-pad .on .tc-lit {
        fill: #5a3f2c;
      }
      .tc-pad .on .tc-tri {
        fill: #f2b84b;
      }
      .tc-block {
        display: grid;
        gap: 10px;
      }
      #touch-controls[data-layout='bar'] .tc-block {
        grid-template-columns: 76px 88px;
        grid-template-rows: 1fr 1fr;
        grid-template-areas: 'sound ok' 'back ok';
      }
      #touch-controls[data-layout='side'] .tc-block {
        grid-template-columns: 1fr;
        grid-template-rows: 48fr 56fr 76fr;
        grid-template-areas: 'sound' 'back' 'ok';
        gap: 12px;
      }
      .tc-sound {
        grid-area: sound;
      }
      .tc-back {
        grid-area: back;
      }
      .tc-ok {
        grid-area: ok;
      }
      .tc-btn {
        margin: 0;
        padding: 0;
        min-width: 0;
        font: bold 17px Georgia, 'Times New Roman', serif;
        color: #f4e4c1;
        background: linear-gradient(#3a2a21, #2a1d17);
        border: 2px solid #8a6a3c;
        border-radius: 12px;
        box-shadow: 0 3px 0 #0b0706;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .tc-ok {
        font-size: 22px;
        color: #f2b84b;
        border-color: #b07a22;
      }
      .tc-btn.on {
        background: #5a3f2c;
        border-color: #f2b84b;
        color: #f2b84b;
        box-shadow: 0 1px 0 #0b0706;
        transform: translateY(2px);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" tabindex="0" aria-label="KeepFall game"></canvas>
      <!-- Touch controls, built by src/ui/touch.ts. Hidden until the first touch. -->
      <div id="touch-controls"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
