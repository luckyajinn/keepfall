<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KeepFall</title>
    <style>
      :root {
        /* Room kept free for the touch controls: a bar under the game, or a strip on each side.
           Both stay 0 until the controls are shown. src/ui/touch.ts sets them. */
        --touch-h: 0px;
        --side-w: 0px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        /* The deepest color in the game's color set (src/render/colors.ts). */
        background: #140c0a;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      /* The screen minus the phone's safe areas (notches and rounded corners). */
      #stage {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        box-sizing: border-box;
        padding: 0 var(--side-w) var(--touch-h);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The canvas holds the 400 by 300 pixel grid. It is scaled up with nearest neighbor so every
         art pixel stays a crisp square. src/main.ts picks the size. Older browsers need the first lines. */
      #game {
        display: block;
        flex: none;
        background: #22150f;
        outline: none;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        -ms-interpolation-mode: nearest-neighbor;
      }
      #touch-controls {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #touch-controls.on {
        display: block;
      }
      .tc-pad,
      .tc-block {
        position: absolute;
        pointer-events: auto;
      }
      /* Every control face is pixel art on canvases at native size (src/ui/touch.ts), enlarged with
         nearest neighbor like the game. touch.ts sizes each control to whole art pixels. */
      .tc-face,
      .tc-lit {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }
      /* A held arm of the pad is a lit copy of that arm, laid over the rest. */
      .tc-lit {
        visibility: hidden;
      }
      .tc-lit.on {
        visibility: visible;
      }
      .tc-block {
        display: grid;
      }
      #touch-controls[data-layout='bar'] .tc-block {
        grid-template-areas: 'sound ok' 'back ok';
      }
      #touch-controls[data-layout='side'] .tc-block {
        grid-template-areas: 'sound' 'back' 'ok';
      }
      .tc-sound {
        grid-area: sound;
      }
      .tc-back {
        grid-area: back;
      }
      .tc-ok {
        grid-area: ok;
      }
      .tc-btn {
        position: relative;
        display: block;
        margin: 0;
        padding: 0;
        min-width: 0;
        border: 0;
        background: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .tc-held,
      .tc-btn.on .tc-rest {
        visibility: hidden;
      }
      .tc-btn.on .tc-held {
        visibility: visible;
      }
      /* The button's name for screen readers. The label on screen is drawn in the pixel font. */
      .tc-name {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" tabindex="0" aria-label="KeepFall game"></canvas>
      <!-- Touch controls, built by src/ui/touch.ts. Hidden until the first touch. -->
      <div id="touch-controls"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
